name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workspace:
    name: workspace + i18n + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: check:workspace
        run: pnpm check:workspace

      - name: check:i18n
        run: pnpm check:i18n

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build
