name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workspace:
    name: workspace + i18n + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build domain + i18n (consumed by api/web via dist)
        run: |
          npm run build -w @sentropic/openerp-domain
          npm run build -w @sentropic/openerp-i18n

      - name: check:workspace
        run: npm run check:workspace

      - name: check:i18n
        run: npm run check:i18n

      # Catches web routes an ingress prefix would hand to the API, which no
      # test can see because a developer machine has no ingress in front.
      - name: check:ingress
        run: npm run check:ingress

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        run: npm run build

  e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build domain + i18n (consumed by web)
        run: |
          npm run build -w @sentropic/openerp-domain
          npm run build -w @sentropic/openerp-i18n

      - name: Install Playwright browsers
        run: npx --workspace @sentropic/openerp-web playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e -w @sentropic/openerp-web

      - name: Run e2e (platform auth UI)
        env:
          OPENERP_PLATFORM_AUTH_UI_ENABLED: "1"
        run: npm run test:e2e -w @sentropic/openerp-web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  integration:
    name: pg integration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openerp_dev
          POSTGRES_USER: openerp
          POSTGRES_PASSWORD: openerp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openerp -d openerp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OPENERP_INTEGRATION_DATABASE_URL: postgresql://openerp:openerp@127.0.0.1:5432/openerp_dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build domain + i18n (consumed by api)
        run: |
          npm run build -w @sentropic/openerp-domain
          npm run build -w @sentropic/openerp-i18n

      - name: Run pg integration smoke
        run: npm test -w @sentropic/openerp-api
