name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workspace:
    name: workspace + i18n + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: check:workspace
        run: npm run check:workspace

      - name: check:i18n
        run: npm run check:i18n

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        run: npm run build
