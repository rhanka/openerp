name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/k8s/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build domain + i18n (consumed by api/worker/web via dist)
        run: |
          npm run build -w @sentropic/openerp-domain
          npm run build -w @sentropic/openerp-i18n

      - name: Lint api
        run: npm run lint -w @sentropic/openerp-api

      - name: Lint worker
        run: npm run lint -w @sentropic/openerp-worker

      - name: Test api
        run: npm test -w @sentropic/openerp-api -- --no-file-parallelism

      - name: Test worker
        run: npm test -w @sentropic/openerp-worker

      - name: Build api
        run: npm run build -w @sentropic/openerp-api

      - name: Build worker
        run: npm run build -w @sentropic/openerp-worker

      - name: Build web
        run: npm run build -w @sentropic/openerp-web

  deploy-dev:
    name: Deploy to dev
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create/refresh Secret
        run: |
          kubectl -n openerp-dev create secret generic openerp-runtime \
            --from-literal=DATABASE_URL='${{ secrets.OPENERP_DEV_DATABASE_URL }}' \
            --from-literal=SESSION_SECRET='${{ secrets.OPENERP_DEV_SESSION_SECRET }}' \
            --from-literal=OPENERP_OIDC_ENABLED='${{ vars.OPENERP_DEV_OIDC_ENABLED }}' \
            --from-literal=OAUTH_ISSUER_URL='${{ vars.OPENERP_DEV_OAUTH_ISSUER_URL }}' \
            --from-literal=OAUTH_CLIENT_ID='${{ vars.OPENERP_DEV_OAUTH_CLIENT_ID }}' \
            --from-literal=OAUTH_CLIENT_SECRET='${{ secrets.OPENERP_DEV_OAUTH_CLIENT_SECRET }}' \
            --from-literal=OAUTH_REDIRECT_URI='${{ vars.OPENERP_DEV_OAUTH_REDIRECT_URI }}' \
            --from-literal=OPENERP_DISABLE_ADMIN_TICKS='true' \
            --from-literal=OPENERP_WORKER_HEALTH_PORT='3001' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kustomize
        run: kubectl apply -k infra/k8s/overlays/dev

      - name: Wait for migration Job
        run: kubectl -n openerp-dev wait --for=condition=complete job/openerp-migrate --timeout=180s

      - name: Wait for rollouts
        run: |
          kubectl -n openerp-dev rollout status deploy/openerp-api --timeout=120s
          kubectl -n openerp-dev rollout status deploy/openerp-worker --timeout=120s
          kubectl -n openerp-dev rollout status deploy/openerp-web --timeout=120s

      - name: Smoke checks
        run: |
          curl --fail --silent --show-error https://openerp-dev.sent-tech.ca/healthz
          curl --fail --silent --show-error https://openerp-dev.sent-tech.ca/readyz
          kubectl -n openerp-dev get pods

  deploy-prod:
    name: Deploy to prod
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create/refresh Secret
        run: |
          kubectl -n openerp-prod create secret generic openerp-runtime \
            --from-literal=DATABASE_URL='${{ secrets.OPENERP_PROD_DATABASE_URL }}' \
            --from-literal=SESSION_SECRET='${{ secrets.OPENERP_PROD_SESSION_SECRET }}' \
            --from-literal=OPENERP_OIDC_ENABLED='${{ vars.OPENERP_PROD_OIDC_ENABLED }}' \
            --from-literal=OAUTH_ISSUER_URL='${{ vars.OPENERP_PROD_OAUTH_ISSUER_URL }}' \
            --from-literal=OAUTH_CLIENT_ID='${{ vars.OPENERP_PROD_OAUTH_CLIENT_ID }}' \
            --from-literal=OAUTH_CLIENT_SECRET='${{ secrets.OPENERP_PROD_OAUTH_CLIENT_SECRET }}' \
            --from-literal=OAUTH_REDIRECT_URI='${{ vars.OPENERP_PROD_OAUTH_REDIRECT_URI }}' \
            --from-literal=OPENERP_DISABLE_ADMIN_TICKS='true' \
            --from-literal=OPENERP_WORKER_HEALTH_PORT='3001' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kustomize
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Wait for migration Job
        run: kubectl -n openerp-prod wait --for=condition=complete job/openerp-migrate --timeout=300s

      - name: Wait for rollouts
        run: |
          kubectl -n openerp-prod rollout status deploy/openerp-api --timeout=180s
          kubectl -n openerp-prod rollout status deploy/openerp-worker --timeout=180s
          kubectl -n openerp-prod rollout status deploy/openerp-web --timeout=180s

      - name: Smoke checks
        run: |
          curl --fail --silent --show-error https://openerp.sent-tech.ca/healthz
          curl --fail --silent --show-error https://openerp.sent-tech.ca/readyz
          kubectl -n openerp-prod get pods
