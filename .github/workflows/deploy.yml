name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/k8s/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build domain + i18n (consumed by api/worker/web via dist)
        run: |
          npm run build -w @sentropic/openerp-domain
          npm run build -w @sentropic/openerp-i18n

      - name: Lint api
        run: npm run lint -w @sentropic/openerp-api

      - name: Lint worker
        run: npm run lint -w @sentropic/openerp-worker

      - name: Test api
        run: npm test -w @sentropic/openerp-api -- --no-file-parallelism

      - name: Test worker
        run: npm test -w @sentropic/openerp-worker

      - name: Build api
        run: npm run build -w @sentropic/openerp-api

      - name: Build worker
        run: npm run build -w @sentropic/openerp-worker

      - name: Build web
        run: npm run build -w @sentropic/openerp-web

  images:
    name: Build + push images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin

      - name: Build + push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: rg.fr-par.scw.cloud/openerp/openerp-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: rg.fr-par.scw.cloud/openerp/openerp-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build + push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: rg.fr-par.scw.cloud/openerp/openerp-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy-dev:
    name: Deploy to dev
    needs: [build, images]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA_DEV }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create/refresh Secret
        run: |
          kubectl -n openerp-dev create secret generic openerp-runtime \
            --from-literal=databaseUrl='${{ secrets.OPENERP_DEV_DATABASE_URL }}' \
            --from-literal=sessionSecret='${{ secrets.OPENERP_DEV_SESSION_SECRET }}' \
            --from-literal=postgresPassword='${{ secrets.OPENERP_DEV_POSTGRES_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin image tags to this commit
        run: sed -i "s|newTag: latest|newTag: ${{ github.sha }}|g" infra/k8s/overlays/dev/kustomization.yaml

      - name: Apply Kustomize
        run: kubectl apply -k infra/k8s/overlays/dev

      - name: Wait for migration Job
        run: kubectl -n openerp-dev wait --for=condition=complete job/openerp-migrate --timeout=180s

      - name: Wait for rollouts
        run: |
          kubectl -n openerp-dev rollout status deploy/openerp-api --timeout=120s
          kubectl -n openerp-dev rollout status deploy/openerp-worker --timeout=120s
          kubectl -n openerp-dev rollout status deploy/openerp-web --timeout=120s

      - name: Smoke checks
        run: |
          curl --fail --silent --show-error https://openerp-dev.sent-tech.ca/healthz
          curl --fail --silent --show-error https://openerp-dev.sent-tech.ca/readyz
          kubectl -n openerp-dev get pods

  deploy-prod:
    name: Deploy to prod
    needs: [build, images]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create/refresh Secret
        run: |
          kubectl -n openerp-prod create secret generic openerp-runtime \
            --from-literal=databaseUrl='${{ secrets.OPENERP_PROD_DATABASE_URL }}' \
            --from-literal=sessionSecret='${{ secrets.OPENERP_PROD_SESSION_SECRET }}' \
            --from-literal=postgresPassword='${{ secrets.OPENERP_PROD_POSTGRES_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin image tags to this commit
        run: sed -i "s|newTag: latest|newTag: ${{ github.sha }}|g" infra/k8s/overlays/prod/kustomization.yaml

      - name: Apply Kustomize
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Wait for migration Job
        run: kubectl -n openerp-prod wait --for=condition=complete job/openerp-migrate --timeout=300s

      - name: Wait for rollouts
        run: |
          kubectl -n openerp-prod rollout status deploy/openerp-api --timeout=180s
          kubectl -n openerp-prod rollout status deploy/openerp-worker --timeout=180s
          kubectl -n openerp-prod rollout status deploy/openerp-web --timeout=180s

      - name: Smoke checks
        run: |
          curl --fail --silent --show-error https://openerp.sent-tech.ca/healthz
          curl --fail --silent --show-error https://openerp.sent-tech.ca/readyz
          kubectl -n openerp-prod get pods
