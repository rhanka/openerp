name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/k8s/**'
      - 'infra/docker/**'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build domain + i18n (consumed by api/worker/web via dist)
        run: |
          npm run build -w @sentropic/openerp-domain
          npm run build -w @sentropic/openerp-i18n

      - name: Lint api
        run: npm run lint -w @sentropic/openerp-api

      - name: Lint worker
        run: npm run lint -w @sentropic/openerp-worker

      - name: Test api
        run: npm test -w @sentropic/openerp-api -- --no-file-parallelism

      - name: Test worker
        run: npm test -w @sentropic/openerp-worker

      - name: Build api
        run: npm run build -w @sentropic/openerp-api

      - name: Build worker
        run: npm run build -w @sentropic/openerp-worker

      - name: Build web
        run: npm run build -w @sentropic/openerp-web

  images:
    name: Build + push images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            rg.fr-par.scw.cloud/openerp/openerp-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: |
            rg.fr-par.scw.cloud/openerp/openerp-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build + push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: |
            rg.fr-par.scw.cloud/openerp/openerp-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # GHCR mirror: non-fatal. Copies the already-pushed Scaleway images
      # to GHCR without rebuilding. A failure here (e.g. package not yet
      # created/public on GHCR) must never break the Scaleway push or deploy.
      - name: Mirror api to GHCR
        continue-on-error: true
        run: docker buildx imagetools create --tag ghcr.io/rhanka/openerp-api:${{ github.sha }} rg.fr-par.scw.cloud/openerp/openerp-api:${{ github.sha }}

      - name: Mirror web to GHCR
        continue-on-error: true
        run: docker buildx imagetools create --tag ghcr.io/rhanka/openerp-web:${{ github.sha }} rg.fr-par.scw.cloud/openerp/openerp-web:${{ github.sha }}

      - name: Mirror worker to GHCR
        continue-on-error: true
        run: docker buildx imagetools create --tag ghcr.io/rhanka/openerp-worker:${{ github.sha }} rg.fr-par.scw.cloud/openerp/openerp-worker:${{ github.sha }}

  deploy-dev:
    name: Deploy to dev
    needs: [build, images]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # This is a fresh runner: the browser smoke imports the workspace's
      # Playwright dependency and cannot rely on the separate build job.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install smoke dependencies
        run: npm ci

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA_DEV }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify coordinated platform-auth manifests
        run: npm run check:auth-cutover

      - name: Create/refresh Secret
        run: |
          kubectl -n openerp-dev create secret generic openerp-runtime \
            --from-literal=databaseUrl='${{ secrets.OPENERP_DEV_DATABASE_URL }}' \
            --from-literal=sessionSecret='${{ secrets.OPENERP_DEV_SESSION_SECRET }}' \
            --from-literal=postgresPassword='${{ secrets.OPENERP_DEV_POSTGRES_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin image tags to this commit
        run: |
          sed -i "s|newTag: latest|newTag: ${{ github.sha }}|g" infra/k8s/overlays/dev/kustomization.yaml

      - name: Recreate migration Job (Job pod templates are immutable)
        run: kubectl -n openerp-dev delete job openerp-migrate --ignore-not-found

      # Keep the legacy web pods serving while the shared ConfigMap switches
      # the API template on. This is the only permitted temporary half state:
      # API=on plus existing web=off, bounded by the API health proof below.
      - name: Hold web rollout for API-first preflight
        run: kubectl -n openerp-dev rollout pause deploy/openerp-web

      - name: Apply Kustomize
        run: kubectl apply -k infra/k8s/overlays/dev

      - name: Roll Postgres onto the latest spec (StatefulSet won't update a CrashLooping pod)
        run: kubectl -n openerp-dev delete pod openerp-postgres-0 --ignore-not-found

      - name: Wait for migration Job
        run: kubectl -n openerp-dev wait --for=condition=complete job/openerp-migrate --timeout=300s

      - name: Wait for API-side rollouts
        run: |
          kubectl -n openerp-dev rollout status deploy/openerp-api --timeout=120s
          kubectl -n openerp-dev rollout status deploy/openerp-worker --timeout=120s
          kubectl -n openerp-dev rollout status deploy/openerp-mailpit --timeout=120s

      - name: Smoke checks (in-cluster app health)
        run: |
          kubectl -n openerp-dev exec deploy/openerp-api -- node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(r.status!==200){console.error('status',r.status);process.exit(1)}return r.text()}).then(t=>{console.log('readyz',t);process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
          kubectl -n openerp-dev get pods

      # This is deliberately independent of a page 200: it proves the
      # feature-gated Hono router is mounted before browser traffic moves.
      - name: Platform auth API smoke (DEV first)
        run: |
          kubectl -n openerp-dev exec deploy/openerp-api -- node -e "fetch('http://127.0.0.1:3000/api/v1/auth/health').then(async r=>{const body=await r.json();if(r.status!==200||body.status!=='ok'||body.service!=='openerp-auth'){console.error(r.status,body);process.exit(1)}console.log('platform-auth',JSON.stringify(body))}).catch(e=>{console.error(e);process.exit(1)})"

      - name: Enable platform auth UI after API proof
        run: |
          kubectl -n openerp-dev rollout resume deploy/openerp-web
          kubectl -n openerp-dev rollout status deploy/openerp-web --timeout=120s

      # The fixture is deliberately pre-provisioned in the target DEV DB;
      # registration cannot create an identity or organization. It is unique
      # per workflow run and contains synthetic burn-in data only.
      - name: Platform auth screen cut-over smoke (DEV)
        env:
          OPENERP_AUTH_SMOKE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          fixture="$(kubectl -n openerp-dev exec deploy/openerp-api -- env OPENERP_AUTH_SMOKE_RUN_ID="$OPENERP_AUTH_SMOKE_RUN_ID" node_modules/.bin/tsx apps/api/src/scripts/auth-cutover-smoke-bootstrap.ts)"
          echo "$fixture" | jq -e '.single.email and .single.organizationId and .multi.email and .multi.organizationId' >/dev/null
          kubectl -n openerp-dev port-forward svc/openerp-mailpit 18025:8025 > /tmp/openerp-mailpit-port-forward.log 2>&1 &
          mailpit_pid=$!
          kubectl -n openerp-dev port-forward svc/openerp-api 13000:3000 > /tmp/openerp-api-port-forward.log 2>&1 &
          api_pid=$!
          trap 'kill "$mailpit_pid" "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18025/api/v1/info >/dev/null && curl --fail --silent http://127.0.0.1:13000/readyz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/openerp-mailpit-port-forward.log /tmp/openerp-api-port-forward.log; exit 1; fi
            sleep 1
          done
          npx playwright install --with-deps chromium
          OPENERP_AUTH_SMOKE_WEB_URL=https://openerp-dev.sent-tech.ca \
          OPENERP_AUTH_SMOKE_API_URL=http://127.0.0.1:13000 \
          OPENERP_AUTH_SMOKE_MAILPIT_URL=http://127.0.0.1:18025 \
          OPENERP_AUTH_SMOKE_FIXTURE="$fixture" \
          npm run smoke:auth-cutover -w @sentropic/openerp-web

      - name: Public endpoint check (informational until the prod cert matures)
        continue-on-error: true
        run: |
          kubectl -n openerp-dev get certificate,ingress
          curl --fail --silent --show-error https://openerp-dev.sent-tech.ca/readyz

      # The hold above is bounded to this run. Leaving it set freezes every
      # later release of the web tier: when Apply Kustomize failed on the
      # immutable Postgres Service, the deployment stayed paused and the web
      # pods kept serving a stale image with the cut-over flag unread. With a
      # single replica and the default rolling update, resuming can never
      # replace a healthy pod with an unhealthy one, so clearing the hold is
      # safe even when the run failed.
      - name: Always clear the web rollout hold
        if: always()
        run: kubectl -n openerp-dev rollout resume deploy/openerp-web || true

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n openerp-dev get pods -o wide || true
          kubectl -n openerp-dev get jobs || true
          kubectl -n openerp-dev describe job/openerp-migrate || true
          kubectl -n openerp-dev describe pod -l app.kubernetes.io/component=migrate || true
          kubectl -n openerp-dev logs -l app.kubernetes.io/name=openerp --tail=80 --all-containers --prefix || true
          kubectl -n openerp-dev get events --sort-by=.lastTimestamp | tail -50 || true

  deploy-prod:
    name: Deploy to prod
    needs: [build, images]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The manifest coordination gate is a workspace script, so provision
      # the same Node dependencies in this otherwise fresh deploy runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install manifest-check dependencies
        run: npm ci

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify coordinated platform-auth manifests
        run: npm run check:auth-cutover

      - name: Create/refresh Secret
        run: |
          kubectl -n openerp-prod create secret generic openerp-runtime \
            --from-literal=databaseUrl='${{ secrets.OPENERP_PROD_DATABASE_URL }}' \
            --from-literal=sessionSecret='${{ secrets.OPENERP_PROD_SESSION_SECRET }}' \
            --from-literal=postgresPassword='${{ secrets.OPENERP_PROD_POSTGRES_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin image tags to this commit
        run: |
          sed -i "s|newTag: latest|newTag: ${{ github.sha }}|g" infra/k8s/overlays/prod/kustomization.yaml

      - name: Recreate migration Job (Job pod templates are immutable)
        run: kubectl -n openerp-prod delete job openerp-migrate --ignore-not-found

      - name: Apply Kustomize
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Roll Postgres onto the latest spec (StatefulSet won't update a CrashLooping pod)
        run: kubectl -n openerp-prod delete pod openerp-postgres-0 --ignore-not-found

      - name: Wait for migration Job
        run: kubectl -n openerp-prod wait --for=condition=complete job/openerp-migrate --timeout=300s

      - name: Wait for rollouts
        run: |
          kubectl -n openerp-prod rollout status deploy/openerp-api --timeout=180s
          kubectl -n openerp-prod rollout status deploy/openerp-worker --timeout=180s
          kubectl -n openerp-prod rollout status deploy/openerp-web --timeout=180s

      - name: Smoke checks (in-cluster app health)
        run: |
          kubectl -n openerp-prod exec deploy/openerp-api -- node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(r.status!==200){console.error('status',r.status);process.exit(1)}return r.text()}).then(t=>{console.log('readyz',t);process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
          kubectl -n openerp-prod get pods

      - name: Public endpoint check (informational until the prod cert matures)
        continue-on-error: true
        run: |
          kubectl -n openerp-prod get certificate,ingress
          curl --fail --silent --show-error https://openerp.sent-tech.ca/readyz

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n openerp-prod get pods -o wide || true
          kubectl -n openerp-prod get jobs || true
          kubectl -n openerp-prod describe job/openerp-migrate || true
          kubectl -n openerp-prod describe pod -l app.kubernetes.io/component=migrate || true
          kubectl -n openerp-prod logs -l app.kubernetes.io/name=openerp --tail=80 --all-containers --prefix || true
          kubectl -n openerp-prod get events --sort-by=.lastTimestamp | tail -50 || true
