# Services for the OpenERP workloads. The Ingress routes to openerp-api/openerp-web;
# the Postgres StatefulSet (serviceName: openerp-postgres) needs its headless Service
# so DATABASE_URL host `openerp-postgres` resolves in-cluster.
apiVersion: v1
kind: Service
metadata:
  name: openerp-api
  labels:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: openerp-web
  labels:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: openerp-postgres
  labels:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: postgres
spec:
  # Deliberately a normal ClusterIP service, not headless. A headless one only
  # buys stable per-pod DNS for peer discovery, which nothing uses here: the
  # StatefulSet runs a single replica and every client — api, worker, migrate
  # job — connects to the service name. Declaring it headless while the live
  # service carries a clusterIP made `kubectl apply` fail permanently on an
  # immutable field, and no deploy could ever go green.
  selector:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
