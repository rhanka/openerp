apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openerp
  labels:
    app.kubernetes.io/name: openerp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging  # overlay overrides for prod
    # Bind the router to the 443 entrypoint with TLS on, or Traefik loads the
    # cert but creates no HTTPS router and every path returns its default 404.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - openerp.example.com  # overlay overrides
    secretName: openerp-tls
  rules:
  - host: openerp.example.com  # overlay overrides
    http:
      paths:
      - path: /readyz
        pathType: Prefix
        backend:
          service:
            name: openerp-api
            port:
              number: 3000
      # The web tier owns /api/locale (the header language switcher posts its
      # form there). An Exact rule is required so it wins over the /api prefix
      # below, which otherwise sends the POST to the API and gets it rejected
      # by the tenant middleware — the switcher was dead in every deployed
      # environment while working locally, where no ingress sits in front.
      - path: /api/locale
        pathType: Exact
        backend:
          service:
            name: openerp-web
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: openerp-api
            port:
              number: 3000
      # Only the agent token exchange still lives under /auth on the API. A
      # Prefix rule here would shadow the web tier's own /auth/* routes: the
      # shell posts its sign-out form to /auth/logout, and with the broad rule
      # that POST reached the API instead of SvelteKit and was rejected by the
      # tenant middleware. Everything else under /auth must fall through to the
      # web via the / rule below.
      - path: /auth/exchange-agent-token
        pathType: Exact
        backend:
          service:
            name: openerp-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openerp-web
            port:
              number: 8080
