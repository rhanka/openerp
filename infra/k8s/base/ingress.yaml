apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openerp
  labels:
    app.kubernetes.io/name: openerp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging  # overlay overrides for prod
    # Bind the router to the 443 entrypoint with TLS on, or Traefik loads the
    # cert but creates no HTTPS router and every path returns its default 404.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - openerp.example.com  # overlay overrides
    secretName: openerp-tls
  rules:
  - host: openerp.example.com  # overlay overrides
    http:
      paths:
      - path: /readyz
        pathType: Prefix
        backend:
          service:
            name: openerp-api
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: openerp-api
            port:
              number: 3000
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: openerp-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openerp-web
            port:
              number: 8080
