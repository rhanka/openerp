apiVersion: apps/v1
kind: Deployment
metadata:
  name: openerp-web
  labels:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openerp
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openerp
        app.kubernetes.io/component: web
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: openerp-registry
      containers:
        - name: web
          image: openerp/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Drives the Secure attribute on the cookies the web tier sets
            # itself: openerp_locale and the legacy login-finish session. No
            # image sets it, so without this they go out without Secure.
            - name: NODE_ENV
              value: production
            # Must stay OPENERP_API_URL: every +page.server.ts and the passkey
            # proxy routes read this name and otherwise fall back to
            # http://127.0.0.1:4000, which only exists on a developer machine.
            - name: OPENERP_API_URL
              value: http://openerp-api:3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 320Mi
