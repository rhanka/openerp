apiVersion: apps/v1
kind: Deployment
metadata:
  name: openerp-api
  labels:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openerp
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openerp
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: openerp-registry
      containers:
        - name: api
          image: openerp/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openerp-runtime
                  key: databaseUrl
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: openerp-runtime
                  key: sessionSecret
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: openerp-update-state
                  key: currentVersion
            - name: OPENERP_CURRENT_VERSION
              valueFrom:
                configMapKeyRef:
                  name: openerp-update-state
                  key: currentVersion
            - name: OPENERP_LATEST_SUPPORTED_VERSION
              valueFrom:
                configMapKeyRef:
                  name: openerp-update-state
                  key: latestSupportedVersion
            - name: OPENERP_SUPPORT_WINDOW
              valueFrom:
                configMapKeyRef:
                  name: openerp-update-state
                  key: supportWindow
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 448Mi
