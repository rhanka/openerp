apiVersion: batch/v1
kind: Job
metadata:
  name: openerp-migrate
  labels:
    app.kubernetes.io/name: openerp
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openerp
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      imagePullSecrets:
        - name: openerp-registry
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - "until pg_isready -h openerp-postgres -p 5432 -U openerp; do echo waiting for postgres; sleep 2; done"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migrate
          image: openerp/api:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npm run migrate -w @sentropic/openerp-api"]
          env:
            - name: OPENERP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openerp-runtime
                  key: databaseUrl
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: openerp-runtime
                  key: sessionSecret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
