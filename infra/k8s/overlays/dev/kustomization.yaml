apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openerp-dev
resources:
- ../../base
# Mailpit is a DEV-only application component of this tenant; see mailpit.yaml.
- mailpit.yaml
patches:
- target:
    kind: Ingress
    name: openerp
  path: ingress-patch.yaml
- target:
    kind: Deployment
    name: openerp-api
  path: keda-replicas-patch.yaml
- target:
    kind: Deployment
    name: openerp-web
  path: keda-replicas-patch.yaml
- path: resources-patch.yaml
- path: api-auth-config-patch.yaml
commonLabels:
  openerp.env: dev
images:
- name: openerp/api
  newName: rg.fr-par.scw.cloud/openerp/openerp-api
  newTag: latest # CI rewrites to the commit SHA before apply (deploy.yml "Pin image tags")
- name: openerp/web
  newName: rg.fr-par.scw.cloud/openerp/openerp-web
  newTag: latest
- name: openerp/worker
  newName: rg.fr-par.scw.cloud/openerp/openerp-worker
  newTag: latest
