apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openerp-dev
resources:
- ../../base
components:
# Registry selector: GHCR, public packages, no pull secret. Switch to
# registry-ovh-TODO-POC-K8S only once poc-k8s fills the exact OVH registry
# paths. registry-scaleway stays the rollback path for as long as it still
# holds the images.
- ../../components/registry-ghcr
patches:
- target:
    kind: Ingress
    name: openerp
  path: ingress-patch.yaml
- target:
    kind: Deployment
    name: openerp-api
  path: keda-replicas-patch.yaml
- target:
    kind: Deployment
    name: openerp-web
  path: keda-replicas-patch.yaml
- path: resources-patch.yaml
- path: api-auth-config-patch.yaml
commonLabels:
  openerp.env: dev
