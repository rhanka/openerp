apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openerp-dev
resources:
- ../../base
components:
# Registry selector: change this one line to registry-ghcr after its target
# access is verified, or to registry-ovh-TODO-POC-K8S only after poc-k8s fills
# the exact OVH registry paths. registry-scaleway is the rollback baseline.
- ../../components/registry-scaleway
patches:
- target:
    kind: Ingress
    name: openerp
  path: ingress-patch.yaml
- path: resources-patch.yaml
commonLabels:
  openerp.env: dev
