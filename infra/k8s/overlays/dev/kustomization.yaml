apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openerp-dev
resources:
- ../../base
patches:
- target:
    kind: Ingress
    name: openerp
  path: ingress-patch.yaml
- path: resources-patch.yaml
commonLabels:
  openerp.env: dev
images:
- name: openerp/api
  newName: rg.fr-par.scw.cloud/openerp/openerp-api
  newTag: latest # CI rewrites to the commit SHA before apply (deploy.yml "Pin image tags")
- name: openerp/web
  newName: rg.fr-par.scw.cloud/openerp/openerp-web
  newTag: latest
- name: openerp/worker
  newName: rg.fr-par.scw.cloud/openerp/openerp-worker
  newTag: latest
